name: CI/CD MLflow

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python 3.12.7
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12.7"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install mlflow==2.19.0 pandas scikit-learn

            - name: Run mlflow project
              run: |
                  cd MLProject
                  mlflow run . --env-manager=local

            - name: Get latest MLflow run_id
              run: |
                  cd MLProject
                  RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
                  echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
                  echo "Latest run_id: $RUN_ID"

            - name: Bypass Anaconda TOS via MLflow Patch
              run: |
                  python -c "import mlflow, os; path = os.path.join(mlflow.__path__[0], 'models', 'docker_utils.py'); data = open(path).read().replace('from mlflow.models import container as C', 'import os; os.environ[\"CONDA_PLUGINS_AUTO_ACCEPT_TOS\"]=\"true\"; from mlflow.models import container as C'); open(path, 'w').write(data)"

            - name: Build Docker Model
              run: |
                  cd MLProject
                  mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name ${{ secrets.DOCKERHUB_USERNAME }}/shipping-prediction:latest --env-manager=conda

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # 6. Push ke Docker Hub
            - name: Push Docker Image
              run: |
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/shipping-prediction:latest
